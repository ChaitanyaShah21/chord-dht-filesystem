# prometheus-compose.yml -- the same scrape, for compose.yaml (D-064; tested by scripts/e2e-compose.sh).
# Every container's metrics port is 8001; the addresses are compose.yaml's fixed ones.

global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 2s

scrape_configs:
  - job_name: chordfs
    static_configs:
      - targets: ["172.28.0.10:8001", "172.28.0.20:8001", "172.28.0.30:8001"]
        labels: { component: tracker }
      - targets: ["172.28.0.11:8001", "172.28.0.12:8001", "172.28.0.13:8001", "172.28.0.14:8001", "172.28.0.15:8001"]
        labels: { component: node }
