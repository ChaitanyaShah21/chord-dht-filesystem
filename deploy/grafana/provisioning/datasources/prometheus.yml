# Grafana's data source, provisioned at start-up (decision D-088). PROM_URL is set by
# scripts/observe.sh (http://127.0.0.1:9090) or by compose.yaml (http://prometheus:9090).
apiVersion: 1
datasources:
  - name: Prometheus
    uid: chordfs-prom
    type: prometheus
    access: proxy
    url: ${PROM_URL}
    isDefault: true
    jsonData:
      timeInterval: 2s           # the scrape interval, so $__rate_interval is computed from it
